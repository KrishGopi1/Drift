name: CI

on:
  pull_request:
  push:
    branches: [ui/visual-refresh, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build, test and checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Stages: driftChecks (no INTERNET, no placeholders, dependency rules), unit + property tests,
      # assembleDebug, screenshot verification, lint. Stops at the first failure.
      - name: Run scripts/ci.sh
        run: scripts/ci.sh

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          retention-days: 7
